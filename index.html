<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Katakana - Colunas A, KA e GA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffe6eb; /* Fundo rosinha claro */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #d63384;
            margin-bottom: 20px;
            font-size: 2.2rem;
            text-align: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 800px;
            width: 100%;
        }

        .card {
            background-color: #ffb6c1; /* Rosinha dos cards */
            border: 3px solid #ff85a2;
            border-radius: 12px;
            height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            user-select: none;
            position: relative;
        }

        .card:hover {
            transform: translateY(-3px);
            background-color: #ff9eb5;
        }

        /* Estado 0: Letra do Alfabeto */
        .label-letter {
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* Estado 1: Katakana */
        .katakana {
            font-size: 3.8rem;
            font-weight: bold;
            color: #333333;
            display: none;
        }

        /* Estado 2: Resposta em Romaji */
        .romaji {
            font-size: 1.2rem;
            font-weight: bold;
            color: #d63384;
            background-color: #ffffff;
            width: 100%;
            text-align: center;
            padding: 4px 0;
            position: absolute;
            bottom: 0;
            border-bottom-left-radius: 9px;
            border-bottom-right-radius: 9px;
            display: none;
        }

        /* Estilos aplicados via JavaScript conforme o clique */
        .card.step-1 {
            background-color: #ffffff;
            border-color: #d63384;
        }
        .card.step-1 .label-letter { display: none; }
        .card.step-1 .katakana { display: block; }

        .card.step-2 {
            background-color: #ffffff;
            border-color: #d63384;
        }
        .card.step-2 .label-letter { display: none; }
        .card.step-2 .katakana { display: block; margin-bottom: 15px; }
        .card.step-2 .romaji { display: block; }

        .reset-btn {
            margin-top: 25px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #d63384;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .reset-btn:hover {
            background-color: #b8216b;
        }
    </style>
</head>
<body>

    <h1>Prática de Katakana (A, KA, GA)</h1>
    <div class="grid-container" id="grid"></div>
    <button class="reset-btn" onclick="renderGrid()">Embaralhar / Reiniciar</button>

    <script>
        // Dados das colunas A, KA e GA
        const katakanaData = [
            { kana: 'ア', romaji: 'a' },
            { kana: 'イ', romaji: 'i' },
            { kana: 'ウ', romaji: 'u' },
            { kana: 'エ', romaji: 'e' },
            { kana: 'オ', romaji: 'o' },
            { kana: 'カ', romaji: 'ka' },
            { kana: 'キ', romaji: 'ki' },
            { kana: 'ク', romaji: 'ku' },
            { kana: 'ケ', romaji: 'ke' },
            { kana: 'コ', romaji: 'ko' },
            { kana: 'ガ', romaji: 'ga' },
            { kana: 'ギ', romaji: 'gi' },
            { kana: 'グ', romaji: 'gu' },
            { kana: 'ゲ', romaji: 'ge' },
            { kana: 'ゴ', romaji: 'go' }
        ];

        const alphabet = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'O'];

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            // Embaralha as letras japonesas
            const shuffledKana = shuffle([...katakanaData]);

            shuffledKana.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.step = '0'; // Controle de cliques (0: Letra, 1: Katakana, 2: Resposta)

                card.innerHTML = `
                    <span class="label-letter">${alphabet[index]}</span>
                    <span class="katakana">${item.kana}</span>
                    <span class="romaji">${item.romaji}</span>
                `;

                card.addEventListener('click', () => {
                    let step = parseInt(card.dataset.step);
                    step = (step + 1) % 3; // Alterna entre 0, 1 e 2
                    card.dataset.step = step;

                    card.classList.remove('step-1', 'step-2');
                    if (step === 1) card.classList.add('step-1');
                    if (step === 2) card.classList.add('step-2');
                });

                grid.appendChild(card);
            });
        }

        // Inicializa o jogo ao carregar a página
        renderGrid();
    </script>
</body>
</html>
